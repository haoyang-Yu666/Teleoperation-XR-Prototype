<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quick Start Profile Prototype</title>
  <style>
    :root {
      --panel: rgba(38, 32, 25, 0.91);
      --panel-strong: rgba(24, 21, 17, 0.82);
      --panel-soft: rgba(255, 255, 255, 0.055);
      --line: rgba(255, 255, 255, 0.08);
      --text: rgba(255, 255, 255, 0.94);
      --muted: rgba(255, 255, 255, 0.58);
      --muted-2: rgba(255, 255, 255, 0.36);
      --blue: #6fa9df;
      --blue-strong: #77b8f2;
      --green: #7ee56f;
      --red: #f14535;
      --button-gray: rgba(125, 118, 108, 0.72);
      --row: rgba(20, 18, 15, 0.42);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background:
        linear-gradient(rgba(52, 47, 41, 0.28), rgba(52, 47, 41, 0.28)),
        linear-gradient(90deg, #2d2722 0 8%, #84786d 8% 13%, #b2a69a 13% 28%, #5d5046 28% 32%, #887b70 32% 47%, #a79b90 47% 62%, #322d28 62% 70%, #7b6c60 70% 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 70%, rgba(190, 170, 140, 0.34), transparent 26%),
        linear-gradient(180deg, transparent 0 63%, rgba(38, 33, 28, 0.32) 63% 100%),
        repeating-linear-gradient(90deg, transparent 0 232px, rgba(0, 0, 0, 0.16) 233px 235px);
      filter: blur(0.2px);
      pointer-events: none;
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 28px;
    }

    .shell {
      position: relative;
      width: min(1280px, calc(100vw - 56px));
      height: min(860px, calc(100vh - 56px));
      min-height: 760px;
      display: grid;
      grid-template-columns: 390px 1fr;
      overflow: hidden;
      border-radius: 46px;
      background: linear-gradient(90deg, rgba(20, 17, 14, 0.94), var(--panel));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.36);
    }

    .sidebar {
      position: relative;
      padding: 52px 48px 42px;
      background: linear-gradient(180deg, rgba(28, 24, 20, 0.98), rgba(19, 18, 15, 0.96));
      border-right: 1px solid rgba(255, 255, 255, 0.045);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 118px;
    }

    .logo {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: #050505;
    }

    .logo svg {
      width: 62px;
      height: 62px;
    }

    .brand-title {
      font-size: 34px;
      line-height: 1;
      letter-spacing: 0;
    }

    .nav {
      display: grid;
      gap: 22px;
    }

    .nav-item {
      width: 100%;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 24px;
      border-radius: 17px;
      color: rgba(255, 255, 255, 0.92);
      font-size: 27px;
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.14);
    }

    .nav-icon {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.78);
      color: rgba(36, 35, 34, 0.82);
      font-size: 19px;
      font-weight: 700;
    }

    .nav-item.active .nav-icon {
      color: white;
      background: var(--blue);
    }

    .about {
      position: absolute;
      left: 48px;
      bottom: 46px;
      display: flex;
      align-items: center;
      gap: 18px;
      color: rgba(255, 255, 255, 0.88);
      font-size: 22px;
    }

    .about-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.76);
      color: rgba(36, 35, 34, 0.86);
      font-weight: 800;
    }

    .main {
      position: relative;
      min-width: 0;
      padding: 56px 72px 118px;
      background:
        radial-gradient(circle at 60% 20%, rgba(105, 93, 80, 0.2), transparent 36%),
        linear-gradient(90deg, rgba(71, 58, 48, 0.42), rgba(33, 29, 24, 0.48));
    }

    .page-title {
      margin: 0 0 28px;
      text-align: center;
      font-size: 34px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .content {
      width: min(820px, 100%);
      margin: 0 auto;
    }

    .section-label {
      margin: 0 0 14px 24px;
      font-size: 24px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
    }

    .current-card,
    .profile-card {
      border-radius: 22px;
      background: var(--row);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.025);
    }

    .current-card {
      padding: 16px 18px 18px;
      margin-bottom: 42px;
    }

    .current-top {
      display: grid;
      grid-template-columns: 1fr 188px;
      gap: 18px;
      align-items: center;
    }

    .profile-input {
      width: 100%;
      height: 52px;
      padding: 0 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      outline: none;
      border-radius: 18px;
      background: rgba(122, 115, 107, 0.62);
      color: var(--text);
      text-align: center;
      font: inherit;
      font-size: 24px;
    }

    .profile-input:focus {
      border-color: rgba(111, 169, 223, 0.78);
      box-shadow: 0 0 0 3px rgba(111, 169, 223, 0.2);
    }

    .meta {
      margin: 14px 8px 0;
      color: var(--muted);
      font-size: 18px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn {
      height: 52px;
      min-width: 96px;
      padding: 0 24px;
      border: 0;
      border-radius: 17px;
      color: white;
      font: inherit;
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease, background 0.12s ease;
      background: var(--button-gray);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
      opacity: 0.86;
    }

    .btn.primary {
      background: var(--blue);
    }

    .btn.primary:hover {
      background: var(--blue-strong);
    }

    .btn.saved,
    .btn.applied {
      color: rgba(255, 255, 255, 0.72);
      cursor: default;
      background: rgba(120, 114, 106, 0.55);
    }

    .btn.saved:hover,
    .btn.applied:hover {
      transform: none;
      background: rgba(120, 114, 106, 0.55);
    }

    .btn.delete {
      min-width: 78px;
      padding: 0 22px;
      background: rgba(125, 118, 108, 0.72);
    }

    .saved-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .count-label {
      color: var(--muted-2);
      font-size: 16px;
    }

    .saved-list-wrap {
      height: 320px;
      overflow-y: auto;
      padding-right: 12px;
      margin-right: -12px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.52) rgba(0, 0, 0, 0.55);
    }

    .saved-list-wrap::-webkit-scrollbar {
      width: 10px;
    }

    .saved-list-wrap::-webkit-scrollbar-track {
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
    }

    .saved-list-wrap::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.52);
    }

    .profiles {
      display: grid;
      gap: 24px;
    }

    .profile-card {
      padding: 16px 18px 18px;
    }

    .profile-row {
      display: grid;
      grid-template-columns: 1fr 142px 84px;
      gap: 16px;
      align-items: center;
    }

    .profile-name {
      height: 48px;
      display: grid;
      place-items: center;
      padding: 0 22px;
      border-radius: 17px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 22px;
      background: rgba(122, 115, 107, 0.62);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      min-height: 210px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.68);
      font-size: 24px;
      font-weight: 500;
    }

    .empty-state span {
      font-size: 16px;
      color: var(--muted-2);
    }

    .quick-start-fixed {
      position: absolute;
      right: 72px;
      bottom: 54px;
      z-index: 3;
      min-width: 160px;
    }

    .toast-layer {
      position: absolute;
      top: 24px;
      left: 50%;
      z-index: 10;
      display: grid;
      gap: 14px;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .toast {
      min-width: 300px;
      height: 70px;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 28px;
      border-radius: 999px;
      background: rgba(25, 21, 17, 0.95);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.24);
      color: white;
      font-size: 25px;
      animation: toastIn 0.18s ease-out, toastOut 0.2s ease-in 2.3s forwards;
    }

    .toast-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      font-size: 26px;
      line-height: 1;
      font-weight: 800;
    }

    .toast.success .toast-icon {
      color: #192119;
      background: var(--green);
    }

    .toast.error .toast-icon {
      color: white;
      background: var(--red);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(-10px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(-8px) scale(0.98);
      }
    }

    @media (max-width: 1050px) {
      .shell {
        grid-template-columns: 300px 1fr;
      }

      .sidebar {
        padding-left: 30px;
        padding-right: 30px;
      }

      .brand-title {
        font-size: 28px;
      }

      .nav-item {
        font-size: 22px;
      }

      .main {
        padding-left: 42px;
        padding-right: 42px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="shell" aria-label="Quick Start profile prototype">
      <aside class="sidebar">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 96 96" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M34 15 20 23v21L10 50v24l20 11 16-9V56l13-8V24L45 15H34Z" />
              <path d="M62 81 76 73V52l10-6V22L66 11 50 20v20L37 48v24l14 9h11Z" />
              <path d="M30 50 48 40" />
              <path d="M49 56 66 46" />
              <circle cx="50" cy="39" r="5" fill="white" stroke="white" />
              <circle cx="47" cy="57" r="5" fill="white" stroke="white" />
            </svg>
          </div>
          <div class="brand-title">Settings</div>
        </div>

        <nav class="nav" aria-label="Settings sections">
          <div class="nav-item"><span class="nav-icon">⚙</span><span>General</span></div>
          <div class="nav-item"><span class="nav-icon">◔</span><span>Tracking</span></div>
          <div class="nav-item"><span class="nav-icon">▣</span><span>Video</span></div>
          <div class="nav-item active"><span class="nav-icon">▷</span><span>Quick Start</span></div>
        </nav>

        <div class="about">
          <span class="about-icon">i</span>
          <span>About Us</span>
        </div>
      </aside>

      <section class="main">
        <div class="toast-layer" id="toastLayer" aria-live="polite"></div>

        <h1 class="page-title">Quick Start</h1>

        <div class="content">
          <p class="section-label">Current Configuration</p>
          <section class="current-card">
            <div class="current-top">
              <input class="profile-input" id="currentName" value="Unsaved Profile" aria-label="Current profile name" />
              <button class="btn primary" id="saveBtn" type="button">Save As Profile</button>
            </div>
            <div class="meta" id="currentMeta">YuShu 1&nbsp;&nbsp;|&nbsp;&nbsp;Independent · 4 Trackers&nbsp;&nbsp;|&nbsp;&nbsp;3 Streams · MJPEG · Full</div>
          </section>

          <div class="saved-header">
            <p class="section-label" style="margin-bottom:0">Saved Profiles</p>
            <span class="count-label" id="profileCount">0 saved</span>
          </div>

          <section class="saved-list-wrap" aria-label="Saved profile list">
            <div class="profiles" id="profiles"></div>
          </section>
        </div>

        <button class="btn primary quick-start-fixed" id="quickStartBtn" type="button">Quick Start</button>
      </section>
    </section>
  </main>

  <script>
    const currentName = document.getElementById("currentName");
    const saveBtn = document.getElementById("saveBtn");
    const profilesEl = document.getElementById("profiles");
    const profileCount = document.getElementById("profileCount");
    const toastLayer = document.getElementById("toastLayer");
    const quickStartBtn = document.getElementById("quickStartBtn");

    const details = [
      "YuShu 1 | Independent · 4 Trackers | 3 Streams · MJPEG · Full",
      "M 1 | Full Body · 4 Trackers | 3 Streams · MJPEG · Full",
      "YuShu 002 | Independent · 4 Trackers | 3 Streams · MJPEG · Full"
    ];

    let profiles = [];
    let appliedId = null;
    let lastSavedName = "";

    function normalizeName(name) {
      return name.trim().replace(/\s+/g, " ");
    }

    function isDuplicate(name) {
      const normalized = normalizeName(name).toLowerCase();
      return profiles.some((profile) => profile.name.toLowerCase() === normalized);
    }

    function showToast(type, message) {
      const toast = document.createElement("div");
      toast.className = "toast " + type;

      const icon = document.createElement("span");
      icon.className = "toast-icon";
      icon.textContent = type === "success" ? "✓" : "×";

      const text = document.createElement("span");
      text.textContent = message;

      toast.append(icon, text);
      toastLayer.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 2700);
    }

    function updateSaveButton() {
      const name = normalizeName(currentName.value);
      if (name && lastSavedName && name.toLowerCase() === lastSavedName.toLowerCase()) {
        saveBtn.textContent = "Saved";
        saveBtn.className = "btn saved";
        saveBtn.disabled = true;
      } else {
        saveBtn.textContent = "Save As Profile";
        saveBtn.className = "btn primary";
        saveBtn.disabled = false;
      }
    }

    function renderProfiles() {
      profilesEl.innerHTML = "";
      profileCount.textContent = profiles.length + (profiles.length === 1 ? " saved" : " saved");

      if (profiles.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.innerHTML = "<div><strong>No Profiles Yet</strong><span>Name the current configuration and save it as a profile.</span></div>";
        profilesEl.appendChild(empty);
        return;
      }

      profiles.forEach((profile) => {
        const card = document.createElement("article");
        card.className = "profile-card";

        const row = document.createElement("div");
        row.className = "profile-row";

        const name = document.createElement("div");
        name.className = "profile-name";
        name.textContent = profile.name;

        const apply = document.createElement("button");
        apply.type = "button";
        apply.className = profile.id === appliedId ? "btn applied" : "btn primary";
        apply.textContent = profile.id === appliedId ? "Applied" : "Apply";
        apply.disabled = profile.id === appliedId;
        apply.addEventListener("click", () => {
          appliedId = profile.id;
          currentName.value = profile.name;
          lastSavedName = profile.name;
          renderProfiles();
          updateSaveButton();
          showToast("success", "Profile Applied");
        });

        const del = document.createElement("button");
        del.type = "button";
        del.className = "btn delete";
        del.textContent = "Del";
        del.addEventListener("click", () => {
          profiles = profiles.filter((item) => item.id !== profile.id);
          if (appliedId === profile.id) appliedId = null;
          if (lastSavedName.toLowerCase() === profile.name.toLowerCase()) lastSavedName = "";
          renderProfiles();
          updateSaveButton();
          showToast("success", "Profile Deleted");
        });

        row.append(name, apply, del);

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = profile.meta;

        card.append(row, meta);
        profilesEl.appendChild(card);
      });
    }

    saveBtn.addEventListener("click", () => {
      const name = normalizeName(currentName.value);

      if (!name || name.toLowerCase() === "unsaved profile") {
        showToast("error", "Please enter a profile name.");
        currentName.focus();
        return;
      }

      if (isDuplicate(name)) {
        showToast("error", "Duplicate name. Please rename.");
        currentName.focus();
        return;
      }

      const nextProfile = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2),
        name,
        meta: details[profiles.length % details.length]
      };

      profiles.unshift(nextProfile);
      appliedId = nextProfile.id;
      lastSavedName = name;
      renderProfiles();
      updateSaveButton();
      showToast("success", "Profile Saved");
    });

    currentName.addEventListener("input", updateSaveButton);
    currentName.addEventListener("focus", () => {
      if (currentName.value === "Unsaved Profile") currentName.select();
    });

    quickStartBtn.addEventListener("click", () => {
      if (!appliedId) {
        showToast("error", "Apply a profile first.");
        return;
      }
      showToast("success", "Quick Start Success");
    });

    renderProfiles();
    updateSaveButton();
  </script>
  <script>
    (() => {
      const style = document.createElement('style');
      style.textContent = `
        button,
        .save-as-profile,
        .save-profile-btn,
        .current-config button {
          white-space: nowrap !important;
        }
        .save-as-profile,
        .save-profile-btn {
          min-width: 220px !important;
        }
      `;
      document.head.appendChild(style);

      const refreshQuickStartLabels = () => {
        document.querySelectorAll('button').forEach((button) => {
          const label = button.textContent.trim().replace(/\s+/g, ' ');
          if (label === 'Saved') button.textContent = 'Existed';
          if (label === 'Save As Profile') button.classList.add('save-as-profile');
        });
      };

      refreshQuickStartLabels();
      new MutationObserver(refreshQuickStartLabels).observe(document.body, {
        childList: true,
        subtree: true,
        characterData: true
      });
    })();
  </script>
</body>
</html>
